sample_fraction: 1.0

ingest:
  max_records_per_file: 1000000

synthetic:
  number_of_loans: 250000

spark:
  master: yarn
  app_name: card-loss-engine-emr
  driver_memory: 4g
  # 12 worker cores (3 core nodes x 4 vCPU); use about 2-3x executor cores.
  shuffle_partitions: 32

# Submit-time settings are inherited by SparkSession.getOrCreate(). One executor
# per 4-vCPU/16-GiB core node uses 3 cores and 9 GiB, leaving 1 core plus roughly
# 7 GiB for YARN/OS overhead. submit_stage.sh disables EMR's default dynamic
# allocation so the configured three-executor topology is authoritative.
spark_submit:
  executor_memory: 9g
  executor_cores: 3
  num_executors: 3
  event_log_enabled: true
  event_log_dir: s3://${CLE_S3_BUCKET}/spark-events/
