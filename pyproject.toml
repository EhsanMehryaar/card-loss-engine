[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "card-loss-engine"
version = "0.1.0"
description = "Consumer credit loss forecasting and CECL allowance engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "pyarrow>=14.0",
  "pyspark>=3.5,<4.0",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "patsy>=0.5",
  "matplotlib>=3.8",
  "fsspec>=2023.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.9"]

[project.scripts]
card-loss-engine = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E9 includes parser failures on Ruff versions that expose them as E999. With
# target-version = "py311", newer Ruff versions always report the equivalent
# invalid-syntax diagnostic even though E999 itself is no longer selectable.
select = ["E", "E9", "F", "I", "UP", "B"]
